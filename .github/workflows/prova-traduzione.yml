name: Prova traduzione
on: workflow_dispatch
jobs:
  prova:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.14"}
      - run: pip install -q requests
      - run: |
          python - <<'PY'
          import requests, translator
          t = "Edon Zhegrova would like to play more and so he could leave Juventus in January's transfer window."
          r = requests.get(translator.GOOGLE_URL, params={"client":"gtx","sl":"auto","tl":"it","dt":"t","q":t}, timeout=10)
          print("GOOGLE", r.status_code, r.headers.get("content-type"), r.text[:300])
          print("RISULTATO", translator.translate_to_italian(t))
          PY
