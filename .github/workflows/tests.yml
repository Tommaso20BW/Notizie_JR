name: Test

# I test girano a ogni modifica al codice (non ai salvataggi dello stato) e a mano.
on:
  push:
    branches: [main]
    paths:
      - "**.py"
      - "requirements*.txt"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v6

      - name: Configura Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-juve-press.txt

      - name: Installa le dipendenze
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check -r requirements-juve-press.txt

      - name: Test
        run: python -m unittest discover -s tests -v
