name: Notizie Web

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  controlla-run:
    name: Controlla se il bot è già attivo
    runs-on: ubuntu-latest
    timeout-minutes: 1

    outputs:
      procedi: ${{ steps.verifica.outputs.procedi }}

    steps:
      - name: Interrompi questo run se ne esiste già uno
        id: verifica
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          CURRENT_RUN_NUMBER: ${{ github.run_number }}
        run: |
          RUN_ATTIVO="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/juve-press-news.yml/runs?per_page=100" \
              --jq ".workflow_runs[]
                | select(.id != ${CURRENT_RUN_ID})
                | select(.run_number < ${CURRENT_RUN_NUMBER})
                | select(
                    .status == \"queued\" or
                    .status == \"in_progress\" or
                    .status == \"waiting\" or
                    .status == \"pending\" or
                    .status == \"requested\"
                  )
                | .id" |
            head -n 1
          )"

          if [[ -n "$RUN_ATTIVO" ]]; then
            echo "Il run $RUN_ATTIVO è già attivo."
            echo "Interrompo il nuovo run $CURRENT_RUN_ID."

            echo "procedi=false" >> "$GITHUB_OUTPUT"

            gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${CURRENT_RUN_ID}/cancel" \
              || true

            sleep 5
            exit 0
          fi

          echo "Nessun altro run attivo. Il bot può partire."
          echo "procedi=true" >> "$GITHUB_OUTPUT"

  check-news:
    name: Controlla le notizie
    needs: controlla-run
    if: needs.controlla-run.outputs.procedi == 'true'

    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Scarica il repository
        uses: actions/checkout@v6

      - name: Configura Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-juve-press.txt

      - name: Installa le dipendenze dalla cache pip
        run: python -m pip install --disable-pip-version-check -r requirements-juve-press.txt

      - name: Verifica il supporto video incluso
        run: |
          python - <<'PY'
          import imageio_ffmpeg
          print("FFmpeg incluso:", imageio_ffmpeg.get_ffmpeg_version())
          PY

      - name: Verifica invio Telegram
        shell: bash
        run: |
          set -euo pipefail

          for test_file in tests/test_*.py; do
            if [[ "$(basename "$test_file")" == "test_bot_giornali.py" ]]; then
              echo "Salto $test_file: appartiene al bot dei giornali."
              continue
            fi

            echo "Eseguo $test_file"
            python -m unittest "$test_file" -v
          done

      - name: Controlla le notizie di oggi
        run: python -u juve_press_bot.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          BASELINE_IF_NO_STATE: "true"

      - name: Salva lo stato delle notizie nel repository
        if: always()
        run: |
          if [[ -z "$(git status --porcelain -- .seen_juve_press_news.json .pending_juve_press_news.json)" ]]; then
            echo "Stato invariato: nessun commit necessario."
            exit 0
          fi

          git config user.name "notizie-jr-bot[bot]"
          git config user.email "notizie-jr-bot[bot]@users.noreply.github.com"

          git add \
            .seen_juve_press_news.json \
            .pending_juve_press_news.json

          git commit -m "chore: aggiorna stato notizie"
          git push origin "HEAD:${GITHUB_REF}"

      - name: Pulisci la cronologia dei run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: "0"
        run: |
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/juve-press-news.yml/runs?status=completed&per_page=100" \
            --jq '.workflow_runs
              | sort_by(.created_at)
              | reverse
              | .['"$KEEP"':]
              | .[].id' |
          while read -r RUN_ID; do
            if [[ -z "$RUN_ID" ]]; then
              continue
            fi

            echo "Elimino run $RUN_ID"

            gh api \
              --method DELETE \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" \
              || true
          done

          echo "Pulizia completata."
 