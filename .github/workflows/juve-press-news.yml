name: Notizie Web

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: juventus-press-news
  cancel-in-progress: false

jobs:
  check-news:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Scarica il repository
        uses: actions/checkout@v6

      - name: Configura Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-juve-press.txt

      - name: Installa le dipendenze
        run: |
          python -m pip install --upgrade pip==26.1.2
          pip install -r requirements-juve-press.txt

      - name: Verifica invio Telegram
        run: python -m unittest discover -s tests -v

      - name: Controlla le notizie di oggi
        run: python -u juve_press_bot.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          BASELINE_IF_NO_STATE: "true"

      - name: Salva lo stato degli articoli notificati nel repository
        if: ${{ always() && hashFiles('.seen_juve_press_news.json') != '' }}
        env:
          STATE_FILE: .seen_juve_press_news.json
        run: |
          if [[ -z "$(git status --porcelain -- "$STATE_FILE")" ]]; then
            echo "Stato invariato: nessun commit necessario."
            exit 0
          fi
          git config user.name "notizie-jr-bot[bot]"
          git config user.email "notizie-jr-bot[bot]@users.noreply.github.com"
          git add "$STATE_FILE"
          git commit -m "chore: aggiorna stato notizie"
          git push origin "HEAD:${GITHUB_REF}"

      - name: Pulisci la cronologia dei run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: "5"
        run: |
          gh api "repos/${{ github.repository }}/actions/workflows/juve-press-news.yml/runs?status=completed&per_page=100" \
            --jq '.workflow_runs | sort_by(.created_at) | reverse | .['"$KEEP"':] | .[].id' |
          while read -r RUN_ID; do
            echo "Elimino run $RUN_ID"
            gh api -X DELETE "repos/${{ github.repository }}/actions/runs/$RUN_ID" || true
          done
          echo "Pulizia completata."
