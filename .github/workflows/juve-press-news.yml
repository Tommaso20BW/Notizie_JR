name: Notizie Web

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "juve_press_bot.py"
      - "telegram_notifier.py"
      - "preview_image.py"
      - "video_media.py"
      - "article_journal.py"
      - "referee_designations.py"
      - "requirements-juve-press.txt"
      - ".github/workflows/juve-press-news.yml"

concurrency:
  group: notizie-web-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  actions: write
  contents: write

jobs:
  worker:
    name: Worker
    runs-on: ubuntu-latest
    timeout-minutes: 65

    steps:
      - name: Scarica il repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Configura Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-juve-press.txt

      - name: Installa le dipendenze dalla cache pip
        run: python -m pip install --disable-pip-version-check -r requirements-juve-press.txt

      - name: Configura i checkpoint dello stato
        run: |
          git config user.name "notizie-jr-bot[bot]"
          git config user.email "notizie-jr-bot[bot]@users.noreply.github.com"

      - name: Controlla notizie e designazioni per circa un'ora
        id: workers
        shell: bash
        run: |
          set -euo pipefail

          setsid python -u juve_press_bot.py \
            --worker \
            --duration-seconds 3300 \
            --interval-seconds 15 &
          NEWS_PID=$!

          setsid python -u referee_designations.py \
            --duration-seconds 3300 \
            --interval-seconds 60 &
          REFEREE_PID=$!

          set +e
          wait "$NEWS_PID"
          NEWS_STATUS=$?
          wait "$REFEREE_PID"
          REFEREE_STATUS=$?
          set -e

          if (( NEWS_STATUS != 0 )); then
            echo "Worker notizie terminato con codice $NEWS_STATUS."
            exit "$NEWS_STATUS"
          fi
          if (( REFEREE_STATUS != 0 )); then
            echo "Worker designazioni terminato con codice $REFEREE_STATUS."
            exit "$REFEREE_STATUS"
          fi

      - name: Salva lo stato per il worker successivo
        id: persist_state
        if: always()
        env:
          TARGET_REF: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          FILES=()
          for file in \
            .seen_juve_press_news.json \
            .pending_juve_press_news.json \
            .seen_juve_referee_designations.json
          do
            [[ -e "$file" ]] && FILES+=("$file")
          done

          if (( ${#FILES[@]} > 0 )) && [[ -n "$(git status --porcelain -- "${FILES[@]}")" ]]; then
            git add "${FILES[@]}"
            git commit -m "chore: aggiorna stato notizie e designazioni"
          else
            echo "Nessuna modifica locale da aggiungere al checkpoint."
          fi

          git pull --rebase origin "$TARGET_REF"
          git push origin "HEAD:$TARGET_REF"

      - name: Pulisci la cronologia dei run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: "0"
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/juve-press-news.yml/runs?status=completed&per_page=100" \
            --jq '.workflow_runs | sort_by(.created_at) | reverse | .['"$KEEP"':] | .[].id' |
          while read -r RUN_ID; do
            if [[ -n "$RUN_ID" ]]; then
              gh api --method DELETE \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" || true
            fi
          done
          echo "Pulizia completata."

      - name: Avvia il worker successivo
        if: >-
          always() &&
          steps.persist_state.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REF: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run juve-press-news.yml --ref "$TARGET_REF"
          echo "Worker successivo accodato sul branch $TARGET_REF."
