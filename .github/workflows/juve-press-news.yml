
name: Notizie Web

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "juve_press_bot.py"
      - "telegram_notifier.py"
      - "preview_image.py"
      - "video_media.py"
      - "article_journal.py"
      - "requirements-juve-press.txt"
      - ".github/workflows/juve-press-news.yml"

# Un solo worker per branch. Un normale riavvio resta in coda, mentre un push
# di codice nuovo interrompe il worker precedente per non farlo girare con
# una versione ormai vecchia del bot.
concurrency:
  group: notizie-web-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  actions: write
  contents: write

jobs:
  worker:
    name: Worker
    runs-on: ubuntu-latest
    timeout-minutes: 65

    steps:
      - name: Scarica il repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Configura Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-juve-press.txt

      - name: Installa le dipendenze dalla cache pip
        run: python -m pip install --disable-pip-version-check -r requirements-juve-press.txt

      - name: Configura i checkpoint dello stato
        run: |
          git config user.name "notizie-jr-bot[bot]"
          git config user.email "notizie-jr-bot[bot]@users.noreply.github.com"

      - name: Controlla e pubblica le notizie per circa un'ora
        id: news_worker
        shell: bash
        run: |
          set -euo pipefail

          touch "$WORKER_HEARTBEAT_FILE"
          setsid python -u juve_press_bot.py \
            --worker \
            --duration-seconds 3300 \
            --interval-seconds 15 &
          BOT_PID=$!

          # Se per cinque minuti il bot non completa nessun progresso, termina
          # l'intero gruppo di processi. I passi successivi salvano lo stato e
          # accodano un worker sostitutivo.
          (
            while kill -0 "$BOT_PID" 2>/dev/null; do
              sleep 30
              if ! kill -0 "$BOT_PID" 2>/dev/null; then
                exit 0
              fi

              NOW="$(date +%s)"
              LAST_HEARTBEAT="$(stat -c %Y "$WORKER_HEARTBEAT_FILE")"
              if (( NOW - LAST_HEARTBEAT > 300 )); then
                echo "Worker bloccato: nessun progresso da oltre 5 minuti."
                kill -TERM -- "-$BOT_PID" 2>/dev/null || true
                sleep 10
                kill -KILL -- "-$BOT_PID" 2>/dev/null || true
                exit 0
              fi
            done
          ) &
          WATCHDOG_PID=$!

          set +e
          wait "$BOT_PID"
          BOT_STATUS=$?
          kill "$WATCHDOG_PID" 2>/dev/null || true
          wait "$WATCHDOG_PID" 2>/dev/null || true
          set -e

          exit "$BOT_STATUS"
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TELEGRAM_RICH_MESSAGES: "1"
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNELS_PER_CYCLE: "1"
          BASELINE_IF_NO_STATE: "true"
          CHECKPOINT_STATE_TO_GIT: "true"
          WORKER_HEARTBEAT_FILE: ${{ runner.temp }}/juve-press-worker-heartbeat

      - name: Salva lo stato per il worker successivo
        id: persist_state
        if: always()
        env:
          TARGET_REF: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "$(git status --porcelain -- .seen_juve_press_news.json .pending_juve_press_news.json)" ]]; then
            git add .seen_juve_press_news.json .pending_juve_press_news.json
            git commit -m "chore: aggiorna stato notizie"
          else
            echo "Nessuna modifica locale da aggiungere al checkpoint."
          fi

          # Pubblica anche eventuali checkpoint già committati dal bot ma non
          # ancora arrivati al remote per un errore di rete transitorio.
          git pull --rebase origin "$TARGET_REF"
          git push origin "HEAD:$TARGET_REF"

      - name: Pulisci la cronologia dei run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: "0"
        shell: bash
        run: |
          set -euo pipefail

          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/juve-press-news.yml/runs?status=completed&per_page=100" \
            --jq '.workflow_runs | sort_by(.created_at) | reverse | .['"$KEEP"':] | .[].id' |
          while read -r RUN_ID; do
            if [[ -n "$RUN_ID" ]]; then
              gh api --method DELETE \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" || true
            fi
          done

          echo "Pulizia completata."

      - name: Avvia il worker successivo
        if: >-
          always() &&
          steps.persist_state.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REF: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          MAX_ATTEMPTS=5

          for ATTEMPT in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "Avvio del worker successivo..."
            echo "Tentativo $ATTEMPT/$MAX_ATTEMPTS"

            if OUTPUT=$(gh workflow run juve-press-news.yml --ref "$TARGET_REF" 2>&1); then
              if [[ -n "$OUTPUT" ]]; then
                echo "$OUTPUT"
              fi

              echo "Worker successivo accodato sul branch $TARGET_REF."
              exit 0
            else
              EXIT_CODE=$?
              echo "$OUTPUT" >&2

              if [[ "$OUTPUT" =~ HTTP\ (429|500|502|503|504) ]]; then
                if [[ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]]; then
                  case "$ATTEMPT" in
                    1) WAIT=15 ;;
                    2) WAIT=30 ;;
                    3) WAIT=60 ;;
                    4) WAIT=120 ;;
                  esac

                  echo "Errore temporaneo GitHub. Nuovo tentativo tra $WAIT secondi..."
                  sleep "$WAIT"
                  continue
                fi
              fi

              echo "::error::Impossibile avviare il worker successivo."
              exit "$EXIT_CODE"
            fi
          done
